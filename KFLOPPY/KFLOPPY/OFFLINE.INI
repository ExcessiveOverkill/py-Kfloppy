* offline.ini commands for KFLOPPY.EXE
[KFLOPPY]
  LargeBuffer On
  Log On
* Serial port commands
  * - portable commands
  * StdPort1
  * StdPort2
  * StdPort3
  * StdPort4
  * - MS-DOS specific
  * COM1
  * COM2
  * COM3
  * COM4
  * - Other parameters
  * Baud {rate} Rate is one of the following:
  *             300     1200    2400    4800    9600
  *             19.2k   38.4k   57.6k   115.2k
  * ParityNone
  * ParityEven
  * ParityOdd
  * Stop1
  * Stop2
* Line printer commands
  * - portable
  * StdPrint1
  * StdPrint2
  * StdPrint3
  * - MS-DOS specific
  * LPT1
  * LPT2
  * LPT3
  * LogFile {filespec}  Log file name
  * Page nn             Page length 2 to 99
* boolean switches On|True|Yes|1 / Off|False|No|0
  * Log On              * Turns on logging
  * LargeBuffer On      * Transmit buffer size 128 or 2048
  * Verbose             Turns on verbose mode
  * LineNumber          Turns on line numbering
  * Color               Color or Mono screen

